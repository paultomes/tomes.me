<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="tomes.me — a quiet way in.">
  <meta name="theme-color" content="#0b101a">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noimageindex">
  <link rel="canonical" href="https://tomes.me/">
  <title>tomes.me</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root{--ink:#f2f3f6;--quiet:#a7acb8;--line:rgba(255,255,255,.13);--panel:rgba(17,22,33,.82);--ease:cubic-bezier(.2,.8,.2,1)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-width:320px;background:#0b101a;color:var(--ink);font:16px/1.35 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
    body::before,body::after{content:"";position:fixed;inset:-30%;pointer-events:none;filter:blur(60px);opacity:.55}body::before{background:radial-gradient(circle at 45% 45%,#354c77 0,transparent 22%),radial-gradient(circle at 70% 30%,#553956 0,transparent 20%)}body::after{background:radial-gradient(circle at 23% 70%,#194e54 0,transparent 19%);animation:drift 18s var(--ease) infinite alternate}
    .page{min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));position:relative}.wordmark{position:fixed;top:max(25px,env(safe-area-inset-top));left:28px;letter-spacing:.18em;font-size:.71rem;color:var(--quiet);text-transform:lowercase}.stage{display:grid;justify-items:center;gap:22px;width:min(100%,620px);transition:transform .65s var(--ease)}
    .orb{--size:clamp(142px,28vw,190px);width:var(--size);height:var(--size);padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;position:relative;isolation:isolate;color:inherit;touch-action:manipulation}.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 215deg,#7ba9ff,#ad79ff,#e993b5,#eec17c,#6ccfc1,#7ba9ff);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 20px 65px rgba(0,0,0,.45);transition:transform .65s var(--ease),filter .65s var(--ease)}.orb::after{content:"";position:absolute;inset:18px;border-radius:50%;background:#111827;border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 0 38px rgba(8,12,20,.8)}.orb:hover::before,.orb:focus-visible::before{transform:scale(1.055);filter:brightness(1.14)}.orb span{position:absolute;z-index:1;inset:0;display:grid;place-items:center;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#bac1ce;opacity:.7;transition:opacity .3s}.orb:focus-visible{outline:2px solid #d9e4ff;outline-offset:9px}
    .prompt{margin:0;color:var(--quiet);font-size:.85rem;letter-spacing:.035em;text-align:center}.prompt strong{color:#dde1e8;font-weight:500}.panel{width:min(100%,560px);display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-10px);transition:grid-template-rows .6s var(--ease),opacity .35s var(--ease),transform .6s var(--ease)}.panel-inner{overflow:hidden}.panel-content{padding:5px 0 0}.is-open .panel{grid-template-rows:1fr;opacity:1;transform:translateY(0)}.is-open .stage{transform:translateY(-3vh)}.is-open .orb::before{transform:rotate(66deg) scale(.76)}.is-open .orb span{opacity:0}
    .menu{padding:12px;border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.34);backdrop-filter:blur(24px)}.primary{display:grid;grid-template-columns:1fr 1fr;gap:6px}.destination{min-height:108px;padding:15px;border-radius:18px;color:inherit;text-decoration:none;border:1px solid transparent;display:grid;align-content:space-between;transition:background .2s,border-color .2s,transform .2s}.destination:hover,.destination:focus-visible{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);transform:translateY(-2px);outline:none}.destination small{font-size:.65rem;text-transform:uppercase;letter-spacing:.14em;color:#969dab}.emblem{width:34px;height:34px;display:grid;place-items:center;color:#d9bd7d}.mic{color:#ff78aa}.ski{color:#bfe1ff}.musing{color:#c6b7ff;font-family:Georgia,serif;font-size:1.55rem;font-style:italic}.line{height:1px;background:var(--line);margin:12px 4px}.quiet-links{display:flex;gap:4px;justify-content:center}.quiet-links a{padding:9px 14px;border-radius:999px;color:#b8bfca;text-decoration:none;font-size:.79rem}.quiet-links a:hover,.quiet-links a:focus-visible{background:rgba(255,255,255,.08);outline:none}.close{display:block;margin:5px 0 0 auto;background:none;border:0;color:#8d94a2;padding:7px;cursor:pointer;font:inherit;font-size:.72rem}.close:hover,.close:focus-visible{color:#fff;outline:1px solid rgba(255,255,255,.3);border-radius:8px}
    @keyframes drift{to{transform:translate(6%,4%) scale(1.1)}}@media(max-width:440px){.wordmark{left:22px}.primary{gap:3px}.destination{min-height:96px;padding:13px}.stage{gap:18px}.is-open .stage{transform:translateY(-2vh)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="wordmark">tomes.me</div>
    <section class="stage" aria-label="tomes.me">
      <button class="orb" id="trigger" type="button" aria-expanded="false" aria-controls="navigation" aria-label="Open tomes.me navigation"><span aria-hidden="true">Enter</span></button>
      <p class="prompt" id="prompt" aria-live="polite"><strong>Tap the ring</strong> to find your way in.</p>
      <div class="panel" id="navigation" aria-hidden="true" inert>
        <div class="panel-inner"><div class="panel-content"><nav class="menu" aria-label="Tomes destinations">
          <div class="primary">
            <a class="destination" href="/musings/"><span class="emblem musing" aria-hidden="true">m</span><small>Musings</small></a>
            <a class="destination" href="/snow/"><span class="emblem ski" aria-hidden="true"><svg viewBox="0 0 50 50" width="34" fill="none"><circle cx="25" cy="25" r="20" stroke="currentColor" stroke-width="1.5"/><path d="m7 34 13-20 9 13 5-8 10 15H7Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M25 18v18M18 24h14" stroke="#9bdcf1" stroke-linecap="round" stroke-width="1.7"/><circle cx="34" cy="11" r="3" fill="#f1ae65"/></svg></span><small>Ski trips</small></a>
            <a class="destination" href="https://karaoke.tomes.me/" target="_blank" rel="noopener"><span class="emblem mic" aria-hidden="true"><svg viewBox="0 0 64 64" width="34" fill="none"><defs><linearGradient id="karaoke-gradient" x1="10" x2="54" y1="8" y2="56"><stop stop-color="#ff9d2e"/><stop offset=".56" stop-color="#ff5b55"/><stop offset="1" stop-color="#ff47b7"/></linearGradient></defs><circle cx="32" cy="32" r="27" stroke="url(#karaoke-gradient)" stroke-width="2"/><path d="M22 17.5a10 10 0 0 1 20 0v15a10 10 0 0 1-20 0v-15ZM17 31.5c0 8.3 6.7 15 15 15s15-6.7 15-15M32 46.5V55M24 55h16" stroke="url(#karaoke-gradient)" stroke-linecap="round" stroke-width="2.5"/></svg></span><small>Tomes Karaoke</small></a>
            <a class="destination" href="https://christmas.tomes.me/" target="_blank" rel="noopener"><span class="emblem" aria-hidden="true"><svg viewBox="0 0 64 64" width="34" fill="none"><circle cx="32" cy="32" r="27" stroke="currentColor" stroke-width="2.5"/><path d="M19.4 23.4h25.2M32 23.4v25M20.5 22.5l3.5-4.8m1.5 4.8 3.1-5.1m2.6 5.1 2.4-5.1m2.6 5.1 2.4-5.1m2.6 5.1 3.1-4.8M20.5 24.3l3.5 4.8m1.5-4.8 3.1 5.1m2.6-5.1 2.4 5.1m2.6-5.1 2.4 5.1m2.6-5.1 3.1 4.8" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/><path d="m32 8.5 1.55 4.45L38 14.5l-4.45 1.55L32 20.5l-1.55-4.45L26 14.5l4.45-1.55L32 8.5Z" fill="currentColor"/></svg></span><small>Tomes Christmas</small></a>
          </div>
          <div class="line"></div>
          <div class="quiet-links"><a href="https://mail.google.com/" target="_blank" rel="noopener">Mail</a><a href="https://calendar.google.com/" target="_blank" rel="noopener">Calendar</a></div>
          <button class="close" id="close" type="button">Close <span aria-hidden="true">×</span></button>
        </nav></div></div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const page = document.querySelector('#page');
      const trigger = document.querySelector('#trigger');
      const navigation = document.querySelector('#navigation');
      const close = document.querySelector('#close');
      const prompt = document.querySelector('#prompt');
      const focusable = () => [...navigation.querySelectorAll('a, button:not([disabled])')];
      const isOpen = () => page.classList.contains('is-open');

      function setNavigation(open) {
        page.classList.toggle('is-open', open);
        trigger.setAttribute('aria-expanded', String(open));
        navigation.setAttribute('aria-hidden', String(!open));
        navigation.inert = !open;
        prompt.innerHTML = open ? 'A few places to return to.' : '<strong>Tap the ring</strong> to find your way in.';
        if (open) window.setTimeout(() => focusable()[0]?.focus(), 350);
        else trigger.focus();
      }

      trigger.addEventListener('click', () => setNavigation(!isOpen()));
      close.addEventListener('click', () => setNavigation(false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && isOpen()) setNavigation(false);
        if (event.key !== 'Tab' || !isOpen()) return;
        const items = focusable();
        const first = items[0];
        const last = items[items.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
      document.addEventListener('pointerdown', (event) => {
        if (isOpen() && !event.target.closest('#navigation, #trigger')) setNavigation(false);
      });
    })();
  </script>
</body>
</html>
