<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="tomes.me — a quiet way in."><meta name="theme-color" content="#080b13"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow"><title>tomes.me — Threshold study</title>
  <style>
    :root{--bg:#080b13;--ink:#ecf0f3;--quiet:#8790a0;--line:rgba(223,232,245,.17);--ease:cubic-bezier(.22,.78,.22,1)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{min-width:320px;background:var(--bg);color:var(--ink);font:16px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.world{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#17223a 0%,#0b1020 36%,#080b13 72%)}.world:before{content:"";position:absolute;inset:0;opacity:.45;background-image:radial-gradient(#c2d7ff 1px,transparent 1.2px),radial-gradient(#f4cf9a .8px,transparent 1px);background-position:0 0,37px 51px;background-size:88px 88px,133px 133px;mask-image:radial-gradient(ellipse at center,black,transparent 75%)}.header{position:absolute;inset:max(24px,env(safe-area-inset-top)) 28px auto;display:flex;justify-content:space-between;z-index:3;font-size:.71rem;letter-spacing:.15em;color:#a0aabd;text-transform:lowercase}.home{position:absolute;inset:0;display:grid;place-items:center;z-index:1}.house{width:min(73vw,470px);aspect-ratio:1;position:relative;display:grid;place-items:center}.orbit{position:absolute;inset:0;border:1px solid rgba(191,206,231,.16);border-radius:50%;transform:rotate(-23deg)}.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;background:#d4ad71;box-shadow:0 0 18px #d4ad71}.orbit:before{width:6px;height:6px;top:13%;left:19%}.orbit:after{width:4px;height:4px;right:19%;bottom:12%;background:#a68fce;box-shadow:0 0 15px #a68fce}.door{width:clamp(150px,35vw,214px);aspect-ratio:3/4;border:1px solid rgba(221,232,247,.57);border-radius:108px 108px 9px 9px;background:linear-gradient(160deg,rgba(130,150,188,.15),rgba(11,17,30,.65));box-shadow:inset 0 0 58px rgba(98,132,201,.12),0 0 50px rgba(89,119,180,.14);display:grid;place-items:end center;padding-bottom:28px;cursor:pointer;color:var(--ink);font:inherit;position:relative;overflow:hidden;transition:transform .55s var(--ease),box-shadow .55s var(--ease)}.door:before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.13);border-radius:100px 100px 4px 4px}.door:hover,.door:focus-visible{transform:scale(1.035);box-shadow:inset 0 0 58px rgba(98,132,201,.2),0 0 85px rgba(89,119,180,.3);outline:none}.door span{z-index:1;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#cad4e5}.welcome{position:absolute;bottom:max(42px,calc(env(safe-area-inset-bottom) + 25px));left:0;right:0;text-align:center;color:var(--quiet);font:400 .9rem Georgia,serif}.nav{position:absolute;inset:0;z-index:2;background:rgba(7,10,18,.93);backdrop-filter:blur(14px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .4s}.open .nav{opacity:1;pointer-events:auto}.open .home{transform:scale(1.07);filter:blur(7px);opacity:.3;transition:transform .7s var(--ease),filter .7s,opacity .35s}.constellation{width:min(92vw,790px);position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,3vw,38px);align-items:center}.constellation:before{content:"";position:absolute;left:12%;right:12%;top:48%;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}.place{position:relative;z-index:1;display:grid;justify-items:center;gap:12px;color:var(--ink);text-decoration:none;text-align:center}.place:hover .node,.place:focus-visible .node{transform:translateY(-7px) scale(1.09);border-color:#eef3ff;box-shadow:0 0 38px rgba(143,174,235,.34)}.place:focus-visible{outline:none}.node{width:clamp(57px,8vw,76px);height:clamp(57px,8vw,76px);border:1px solid #71809c;border-radius:50%;background:rgba(103,123,159,.11);display:grid;place-items:center;transition:transform .35s var(--ease),border-color .35s,box-shadow .35s}.label{font:400 clamp(.8rem,1.55vw,1rem) Georgia,serif}.sub{font-size:.61rem;letter-spacing:.12em;text-transform:uppercase;color:#7f8999}.mus{font:italic 2rem Georgia,serif;color:#c7b7f0}.ski{font-size:2rem;color:#b0e0e2}.mic{color:#ff82b4}.star{color:#ddc47e}.utilities{position:absolute;bottom:max(29px,env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:20px;justify-content:center}.utilities a,.leave{color:#838ea0;text-decoration:none;font-size:.74rem}.utilities a:hover,.utilities a:focus-visible,.leave:hover,.leave:focus-visible{color:#fff;outline:none}.leave{position:absolute;top:max(25px,env(safe-area-inset-top));right:28px;border:0;background:none;cursor:pointer;font:inherit}.open .door{transform:scale(.62);opacity:0}@media(max-width:570px){.constellation{grid-template-columns:1fr 1fr;gap:26px 42px;width:min(84vw,360px)}.constellation:before{left:50%;right:auto;top:15%;bottom:15%;height:auto;width:1px;background:linear-gradient(transparent,var(--line),transparent)}.header{inset-left:22px;inset-right:22px}.leave{right:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body><main class="world" id="world"><header class="header"><span>tomes.me</span><span>03 — threshold</span></header><section class="home"><div class="house"><div class="orbit"></div><button class="door" id="door" aria-expanded="false" aria-controls="nav"><span>Open the door</span></button></div><p class="welcome">A private world, in a few small rooms.</p></section><section class="nav" id="nav" aria-hidden="true" inert><button class="leave" id="leave">Return <span aria-hidden="true">×</span></button><nav class="constellation" aria-label="Tomes destinations"><a class="place" href="/musings/"><span class="node mus" aria-hidden="true">m</span><span class="label">Musings</span><span class="sub">notes</span></a><a class="place" href="/snow/"><span class="node ski" aria-hidden="true">⌁</span><span class="label">Ski trips</span><span class="sub">mountains</span></a><a class="place" href="https://karaoke.tomes.me/"><span class="node mic" aria-hidden="true">♫</span><span class="label">Karaoke</span><span class="sub">sing</span></a><a class="place" href="https://christmas.tomes.me/"><span class="node star" aria-hidden="true">✦</span><span class="label">Christmas</span><span class="sub">tradition</span></a></nav><div class="utilities"><a href="https://mail.google.com/">Mail</a><a href="https://calendar.google.com/">Calendar</a></div></section></main><script>const world=document.querySelector('#world'),door=document.querySelector('#door'),nav=document.querySelector('#nav'),leave=document.querySelector('#leave');function set(open){world.classList.toggle('open',open);door.setAttribute('aria-expanded',open);nav.setAttribute('aria-hidden',!open);nav.inert=!open;if(open)setTimeout(()=>nav.querySelector('a').focus(),360);else door.focus()}door.addEventListener('click',()=>set(true));leave.addEventListener('click',()=>set(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});</script></body></html>
